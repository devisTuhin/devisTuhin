<svg width="100%" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">

  <!-- Dark background -->
  <rect width="700" height="260" fill="#0d1117" rx="12" ry="12"/>

  <!-- <p> This is </p> -->
  <text x="50" y="42"
        font-family="'Courier New',Courier,monospace"
        font-size="16" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;p&gt; This is &lt;/p&gt;</text>

  <!-- <h1> -->
  <text x="50" y="68"
        font-family="'Courier New',Courier,monospace"
        font-size="16" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;h1&gt;</text>

  <!-- "is" — neon green -->
  <text x="50" y="155"
        font-family="'Courier New',Courier,monospace"
        font-size="65" font-weight="bold"
        fill="#00FF99">is</text>

  <!-- "Tuhin" — white -->
  <text x="128" y="155"
        font-family="'Courier New',Courier,monospace"
        font-size="65" font-weight="bold"
        fill="#ffffff">Tuhin</text>

  <!-- ".dev" — neon green -->
  <text x="323" y="155"
        font-family="'Courier New',Courier,monospace"
        font-size="65" font-weight="bold"
        fill="#00FF99">.dev</text>

  <!-- Blinking cursor -->
  <rect x="480" y="108" width="8" height="50" fill="#00FF99" rx="1">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- </h1> -->
  <text x="50" y="185"
        font-family="'Courier New',Courier,monospace"
        font-size="16" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;/h1&gt;</text>

  <!-- <p> lovestack software developer </p> -->
  <text x="50" y="242"
        font-family="'Courier New',Courier,monospace"
        font-size="20" font-weight="bold" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;p&gt; lovestack software developer &lt;/p&gt;</text>

</svg>
