<svg width="100%" viewBox="0 0 550 255" xmlns="http://www.w3.org/2000/svg">

  <!-- Dark background -->
  <rect width="550" height="255" fill="#0d1117"/>

  <!-- <p> This is </p> -->
  <text x="32" y="46"
        font-family="'Courier New',Courier,monospace"
        font-size="14" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;p&gt; This is &lt;/p&gt;</text>

  <!-- <h1> -->
  <text x="32" y="72"
        font-family="'Courier New',Courier,monospace"
        font-size="14" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;h1&gt;</text>

  <!-- "is" — neon green -->
  <text x="36" y="148"
        font-family="'Courier New',Courier,monospace"
        font-size="56" font-weight="bold"
        fill="#00FF99">is</text>

  <!-- "Tuhin" — white -->
  <text x="103" y="148"
        font-family="'Courier New',Courier,monospace"
        font-size="56" font-weight="bold"
        fill="#ffffff">Tuhin</text>

  <!-- ".dev" — neon green -->
  <text x="271" y="148"
        font-family="'Courier New',Courier,monospace"
        font-size="56" font-weight="bold"
        fill="#00FF99">.dev</text>

  <!-- Blinking cursor -->
  <rect x="406" y="107" width="7" height="44" fill="#00FF99" rx="1">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- </h1> -->
  <text x="32" y="178"
        font-family="'Courier New',Courier,monospace"
        font-size="14" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;/h1&gt;</text>

  <!-- <p> lovestack software developer </p> -->
  <text x="32" y="236"
        font-family="'Courier New',Courier,monospace"
        font-size="16" font-weight="bold" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;p&gt; lovestack software developer &lt;/p&gt;</text>

</svg>
