<svg width="100%" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">

  <!-- Dark background -->
  <rect width="700" height="260" fill="#0d1117" rx="12" ry="12"/>

  <!-- <p> This is </p> -->
  <text x="50" y="42"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Courier New',monospace"
        font-size="16" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;p&gt; This is &lt;/p&gt;</text>

  <!-- <h1> -->
  <text x="50" y="68"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Courier New',monospace"
        font-size="16" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;h1&gt;</text>

  <!-- Title: isTuhin.dev with inline blinking block cursor -->
  <text x="50" y="155"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Courier New',monospace"
        font-size="62" font-weight="bold"><tspan fill="#00FF99">is</tspan><tspan fill="#ffffff">Tuhin</tspan><tspan fill="#00FF99">.dev</tspan><tspan fill="#00FF99" font-weight="normal"> &#9612;<animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- </h1> -->
  <text x="50" y="185"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Courier New',monospace"
        font-size="16" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;/h1&gt;</text>

  <!-- <p> lovestack software developer </p> -->
  <text x="50" y="242"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Courier New',monospace"
        font-size="20" font-weight="bold" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;p&gt; lovestack software developer &lt;/p&gt;</text>

</svg>
