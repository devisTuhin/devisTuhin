  <circle cx="676" cy="285" r="2.2" fill="#00ff88" opacity="0.38"/>
  <circle cx="582" cy="14" r="1.5" fill="#00ff88" opacity="0.28"/>
  <circle cx="498" cy="292" r="2" fill="#00ff88" opacity="0.38"/>
  <circle cx="422" cy="10" r="1.5" fill="#00ff88" opacity="0.22"/>
