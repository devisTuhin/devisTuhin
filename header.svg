  <circle cx="540" cy="295" r="1.5" fill="#00ff88" opacity="0.35"/>
  <circle cx="20" cy="120" r="1.2" fill="#00ff88" opacity="0.3"/>

  <!-- <p> This is </p> -->
  <text x="30" y="48"
        font-family="'Courier New', Courier, monospace"
        font-size="15"
        fill="#00ff88">&lt;p&gt; This is &lt;/p&gt;</text>

  <!-- <h1> -->
  <text x="30" y="84"
        font-family="'Courier New', Courier, monospace"
        font-size="15"
        fill="#00ff88">&lt;h1&gt;</text>

  <!-- isTuhin.dev title -->
  <text x="30" y="158" font-family="'Courier New', Courier, monospace" font-size="60" font-weight="bold">
    <tspan fill="#00ff88">is</tspan><tspan fill="#ffffff">Tuhin</tspan><tspan fill="#00ff88">.dev</tspan>
  </text>

  <!-- Blinking block cursor -->
  <rect x="428" y="107" width="6" height="56" fill="#00ff88">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- </h1> -->
  <text x="30" y="193"
        font-family="'Courier New', Courier, monospace"
        font-size="15"
        fill="#00ff88">&lt;/h1&gt;</text>

  <!-- <p> lovestack software developer </p> -->
  <text x="30" y="240" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="bold">
    <tspan fill="#00ff88">&lt;p&gt; </tspan>
    <tspan fill="#e6edf3">lovestack software developer </tspan>
    <tspan fill="#00ff88">&lt;/p&gt;</tspan>
  </text>

