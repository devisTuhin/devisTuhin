<svg width="100%" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">

  <rect width="800" height="260" fill="#0d1117"/>

  <!-- Subtle ambient dots -->
  <circle cx="748" cy="28" r="1.8" fill="#00ff88" opacity="0.45"/>
  <circle cx="788" cy="72" r="1.2" fill="#00ff88" opacity="0.28"/>
  <circle cx="762" cy="130" r="2" fill="#00ff88" opacity="0.22"/>
  <circle cx="792" cy="195" r="1.4" fill="#00ff88" opacity="0.35"/>
  <circle cx="710" cy="240" r="1.6" fill="#00ff88" opacity="0.3"/>
  <circle cx="640" cy="16" r="1.4" fill="#00ff88" opacity="0.32"/>
  <circle cx="560" cy="248" r="1.8" fill="#00ff88" opacity="0.25"/>
  <circle cx="380" cy="8"  r="1.2" fill="#00ff88" opacity="0.2"/>
  <circle cx="240" cy="252" r="1.4" fill="#00ff88" opacity="0.25"/>
  <circle cx="120" cy="12" r="1.6" fill="#00ff88" opacity="0.28"/>
  <circle cx="14"  cy="85" r="1.2" fill="#00ff88" opacity="0.3"/>
  <circle cx="10"  cy="200" r="1.6" fill="#00ff88" opacity="0.22"/>
  <circle cx="30"  cy="148" r="1"   fill="#00ff88" opacity="0.35"/>

  <!-- <p> This is </p> -->
  <text x="32" y="44"
        font-family="'Courier New', Courier, monospace"
        font-size="13" letter-spacing="0.5"
        fill="#00ff88" opacity="0.85">&lt;p&gt; This is &lt;/p&gt;</text>

  <!-- <h1> -->
  <text x="32" y="76"
        font-family="'Courier New', Courier, monospace"
        font-size="13" letter-spacing="0.5"
        fill="#00ff88" opacity="0.85">&lt;h1&gt;</text>

  <!-- isTuhin.dev — font-size 58, Courier New ~34.8px/char -->
  <!-- "isTuhin.dev" = 11 chars ≈ 383px, x starts 32, ends ~415 -->
  <text x="32" y="148"
        font-family="'Courier New', Courier, monospace"
        font-size="58" font-weight="bold" letter-spacing="-0.5">
    <tspan fill="#00ff88">is</tspan><tspan fill="#e6edf3">Tuhin</tspan><tspan fill="#00ff88">.dev</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="416" y="99" width="5" height="54" fill="#00ff88">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- </h1> -->
  <text x="32" y="183"
        font-family="'Courier New', Courier, monospace"
        font-size="13" letter-spacing="0.5"
        fill="#00ff88" opacity="0.85">&lt;/h1&gt;</text>

  <!-- Role tagline -->
  <text x="32" y="224"
        font-family="'Courier New', Courier, monospace"
        font-size="17" font-weight="bold" letter-spacing="0.2">
    <tspan fill="#00ff88">&lt;p&gt; </tspan>
    <tspan fill="#c9d1d9">lovestack software developer</tspan>
    <tspan fill="#00ff88"> &lt;/p&gt;</tspan>
  </text>

</svg>
