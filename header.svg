<svg width="100%" viewBox="0 0 900 285" xmlns="http://www.w3.org/2000/svg">

  <!-- Dark background -->
  <rect width="900" height="285" fill="#0d1117"/>

  <!-- <p> This is </p> -->
  <text x="36" y="52"
        font-family="'Courier New',Courier,monospace"
        font-size="13" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;p&gt; This is &lt;/p&gt;</text>

  <!-- <h1> -->
  <text x="36" y="80"
        font-family="'Courier New',Courier,monospace"
        font-size="13" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;h1&gt;</text>

  <!-- "is" — neon green -->
  <text x="50" y="160"
        font-family="'Courier New',Courier,monospace"
        font-size="68" font-weight="bold"
        fill="#00FF99">is</text>

  <!-- "Tuhin" — white -->
  <text x="132" y="160"
        font-family="'Courier New',Courier,monospace"
        font-size="68" font-weight="bold"
        fill="#ffffff">Tuhin</text>

  <!-- ".dev" — neon green -->
  <text x="337" y="160"
        font-family="'Courier New',Courier,monospace"
        font-size="68" font-weight="bold"
        fill="#00FF99">.dev</text>

  <!-- Blinking cursor -->
  <rect x="505" y="108" width="8" height="54" fill="#00FF99" rx="1">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- </h1> -->
  <text x="36" y="193"
        font-family="'Courier New',Courier,monospace"
        font-size="13" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;/h1&gt;</text>

  <!-- <p> lovestack software developer </p> -->
  <text x="36" y="252"
        font-family="'Courier New',Courier,monospace"
        font-size="17" font-weight="bold" letter-spacing="0.5"
        fill="#00FF99" opacity="0.85">&lt;p&gt; lovestack software developer &lt;/p&gt;</text>

</svg>
