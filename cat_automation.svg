<svg width="100%" viewBox="0 0 580 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-auto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="578" height="148" rx="12" fill="url(#grad-auto)"/>

  <!-- Thin Animated Border -->
  <rect x="1" y="1" width="578" height="148" rx="12" fill="none" stroke="#EA4B71" stroke-width="1.5" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#EA4B71;#00FF99;#EA4B71" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Category Title -->
  <text x="24" y="34" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#00FF99">🛠️ Automation, IDEs &amp; Tools</text>

  <!-- Row 1 Badges -->
  <!-- Selenium -->
  <g transform="translate(24, 52)">
    <rect width="102" height="30" rx="6" fill="#43B02A"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Selenium</text>
  </g>

  <!-- Puppeteer -->
  <g transform="translate(136, 52)">
    <rect width="112" height="30" rx="6" fill="#40B5A4"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Puppeteer</text>
  </g>

  <!-- n8n -->
  <g transform="translate(258, 52)">
    <rect width="72" height="30" rx="6" fill="#EA4B71"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">n8n</text>
  </g>

  <!-- Git -->
  <g transform="translate(340, 52)">
    <rect width="68" height="30" rx="6" fill="#F05032"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Git</text>
  </g>

  <!-- VS Code -->
  <g transform="translate(418, 52)">
    <rect width="98" height="30" rx="6" fill="#007ACC"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">VS Code</text>
  </g>

  <!-- Row 2 Badges -->
  <!-- Postman -->
  <g transform="translate(24, 94)">
    <rect width="98" height="30" rx="6" fill="#FF6C37"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Postman</text>
  </g>

  <!-- GitHub -->
  <g transform="translate(132, 94)">
    <rect width="92" height="30" rx="6" fill="#181717" stroke="#ffffff" stroke-width="0.8"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">GitHub</text>
  </g>

</svg>
