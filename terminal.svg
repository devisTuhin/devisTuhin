<svg width="100%" viewBox="0 0 680 185" xmlns="http://www.w3.org/2000/svg">

  <!-- Card -->
  <rect width="680" height="185" rx="10" ry="10" fill="#0d1117" stroke="#1e3a2e" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="678" height="40" rx="9" ry="9" fill="#111827"/>
  <rect x="1" y="26" width="678" height="15" fill="#111827"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="68" cy="21" r="6" fill="#28c840"/>

  <!-- Divider -->
  <line x1="1" y1="41" x2="679" y2="41" stroke="#1e3a2e" stroke-width="1"/>

  <!-- $ whoami -->
  <text x="20" y="68" font-family="'Courier New', Courier, monospace" font-size="14" fill="#00ff88">$</text>
  <text x="36" y="68" font-family="'Courier New', Courier, monospace" font-size="14" fill="#e6edf3"> whoami</text>

  <rect x="20" y="74" width="2" height="18" fill="#1e3a2e"/>
  <text x="36" y="88" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#7d8590">isTuhin.dev — lovestack software developer</text>

  <!-- $ cat about.txt -->
  <text x="20" y="118" font-family="'Courier New', Courier, monospace" font-size="14" fill="#00ff88">$</text>
  <text x="36" y="118" font-family="'Courier New', Courier, monospace" font-size="14" fill="#e6edf3"> cat about.txt</text>

  <rect x="20" y="124" width="2" height="20" fill="#1e3a2e"/>
  <text x="36" y="140" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#7d8590">Founder &amp; Owner of Connectis, NiiHUT &amp; HackiisLab</text>

  <!-- Prompt with blinking cursor -->
  <text x="20" y="168" font-family="'Courier New', Courier, monospace" font-size="14" fill="#00ff88">$</text>
  <rect x="36" y="155" width="9" height="15" fill="#00ff88">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

</svg>
