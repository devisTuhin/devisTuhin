<svg width="100%" viewBox="0 0 570 210" xmlns="http://www.w3.org/2000/svg">

  <!-- Card background -->
  <rect width="570" height="210" rx="14" ry="14" fill="#0d1117"/>

  <!-- Border (neon-green border matching portfolio terminal container) -->
  <rect x="0.5" y="0.5" width="569" height="209" rx="13.5" ry="13.5"
        fill="none" stroke="#27c93f" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="570" height="42" rx="14" ry="14" fill="#111827"/>
  <rect x="0" y="28" width="570" height="14" fill="#111827"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="68" cy="21" r="6" fill="#28c840"/>

  <!-- Separator line -->
  <line x1="0" y1="42" x2="570" y2="42" stroke="#1f2937" stroke-width="1"/>

  <!-- $ whoami -->
  <text x="20" y="72" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#00FF99">$</text>
  <text x="36" y="72" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#ffffff"> whoami</text>

  <!-- whoami output -->
  <rect x="20" y="78" width="2" height="20" fill="#374151"/>
  <text x="36" y="93" font-family="'Courier New',Courier,monospace" font-size="15" fill="#ffffff" font-weight="500">isTuhin.dev <tspan fill="#9ca3af" font-weight="normal">(lovestack software developer)</tspan></text>

  <!-- $ cat leadership.txt -->
  <text x="20" y="126" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#00FF99">$</text>
  <text x="36" y="126" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#ffffff"> cat leadership.txt</text>

  <!-- leadership.txt output -->
  <rect x="20" y="132" width="2" height="24" fill="#00FF99"/>
  <text x="36" y="149" font-family="'Courier New',Courier,monospace" font-size="14" fill="#ffffff" font-weight="bold">Founder &amp; Owner of <tspan fill="#00FF99" text-decoration="underline">Connectis, HackiisLab &amp; Niihut.</tspan></text>

  <!-- Blinking neon green cursor right after Niihut. -->
  <rect x="456" y="135" width="10" height="17" fill="#00FF99" rx="1">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

</svg>
