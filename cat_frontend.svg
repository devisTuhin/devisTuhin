<svg width="100%" viewBox="0 0 580 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="578" height="148" rx="12" fill="url(#grad-front)"/>

  <!-- Thin Animated Border -->
  <rect x="1" y="1" width="578" height="148" rx="12" fill="none" stroke="#61DAFB" stroke-width="1.5" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#61DAFB;#00FF99;#61DAFB" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Category Title -->
  <text x="24" y="34" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#00FF99">🎨 Frontend Frameworks</text>

  <!-- Row 1 Badges -->
  <!-- Flutter -->
  <g transform="translate(24, 52)">
    <rect width="92" height="30" rx="6" fill="#02569B"/>
    <path fill="#40C4FF" d="M14.3 0L5 9.3l4.7 4.7L19 4.7zM9.7 14L5 18.7 14.3 28h4.7L9.7 14z" transform="scale(0.7) translate(5, 2)"/>
    <text x="32" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Flutter</text>
  </g>

  <!-- React Native -->
  <g transform="translate(126, 52)">
    <rect width="126" height="30" rx="6" fill="#20232A" stroke="#61DAFB" stroke-width="1"/>
    <ellipse cx="18" cy="15" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2"/>
    <ellipse cx="18" cy="15" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(60 18 15)"/>
    <ellipse cx="18" cy="15" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(120 18 15)"/>
    <circle cx="18" cy="15" r="1.8" fill="#61DAFB"/>
    <text x="34" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#61DAFB">React Native</text>
  </g>

  <!-- React -->
  <g transform="translate(262, 52)">
    <rect width="84" height="30" rx="6" fill="#20232A" stroke="#61DAFB" stroke-width="1"/>
    <circle cx="17" cy="15" r="2" fill="#61DAFB"/>
    <text x="30" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#61DAFB">React</text>
  </g>

  <!-- Next.js -->
  <g transform="translate(356, 52)">
    <rect width="90" height="30" rx="6" fill="#000000" stroke="#ffffff" stroke-width="0.8"/>
    <text x="12" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Next.js</text>
  </g>

  <!-- Vue.js -->
  <g transform="translate(456, 52)">
    <rect width="86" height="30" rx="6" fill="#4FC08D"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Vue.js</text>
  </g>

  <!-- Row 2 Badges -->
  <!-- Tailwind CSS -->
  <g transform="translate(24, 94)">
    <rect width="130" height="30" rx="6" fill="#06B6D4"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Tailwind CSS</text>
  </g>

  <!-- HTML5 -->
  <g transform="translate(164, 94)">
    <rect width="85" height="30" rx="6" fill="#E34F26"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">HTML5</text>
  </g>

  <!-- CSS3 -->
  <g transform="translate(259, 94)">
    <rect width="78" height="30" rx="6" fill="#1572B6"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">CSS3</text>
  </g>

</svg>
