<svg width="100%" viewBox="0 0 580 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-lang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="578" height="148" rx="12" fill="url(#grad-lang)"/>

  <!-- Thin Animated Border -->
  <rect x="1" y="1" width="578" height="148" rx="12" fill="none" stroke="#00FF99" stroke-width="1.5" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00FF99;#3178C6;#00FF99" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Category Title -->
  <text x="24" y="34" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#00FF99">💻 Programming Languages &amp; Mobile</text>

  <!-- Row 1 Badges (Pills with Icon + Name) -->
  <!-- Dart -->
  <g transform="translate(24, 52)">
    <rect width="82" height="30" rx="6" fill="#0175C2"/>
    <!-- Dart Logo -->
    <path fill="#ffffff" d="M6 15l4.5-9h9L15 15l4.5 9h-9z" transform="scale(0.7) translate(4, 3)"/>
    <text x="32" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Dart</text>
  </g>

  <!-- Flutter -->
  <g transform="translate(116, 52)">
    <rect width="92" height="30" rx="6" fill="#02569B"/>
    <path fill="#40C4FF" d="M14.3 0L5 9.3l4.7 4.7L19 4.7zM9.7 14L5 18.7 14.3 28h4.7L9.7 14z" transform="scale(0.7) translate(5, 2)"/>
    <text x="32" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Flutter</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(218, 52)">
    <rect width="114" height="30" rx="6" fill="#F7DF1E"/>
    <rect x="8" y="6" width="18" height="18" rx="2" fill="#000000"/>
    <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F7DF1E">JS</text>
    <text x="32" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#000000">JavaScript</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(342, 52)">
    <rect width="114" height="30" rx="6" fill="#3178C6"/>
    <rect x="8" y="6" width="18" height="18" rx="2" fill="#ffffff"/>
    <text x="11" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3178C6">TS</text>
    <text x="32" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#ffffff">TypeScript</text>
  </g>

  <!-- Python -->
  <g transform="translate(466, 52)">
    <rect width="90" height="30" rx="6" fill="#3776AB"/>
    <circle cx="17" cy="15" r="7" fill="#FFD43B"/>
    <text x="32" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Python</text>
  </g>

  <!-- Row 2 Badges -->
  <!-- C++ -->
  <g transform="translate(24, 94)">
    <rect width="76" height="30" rx="6" fill="#00599C"/>
    <text x="12" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C++</text>
  </g>

  <!-- Swift -->
  <g transform="translate(110, 94)">
    <rect width="82" height="30" rx="6" fill="#FA7343"/>
    <path fill="#ffffff" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z" transform="scale(0.5) translate(8, 8)"/>
    <text x="30" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Swift</text>
  </g>

</svg>
