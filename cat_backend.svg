<svg width="100%" viewBox="0 0 580 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="578" height="148" rx="12" fill="url(#grad-back)"/>

  <!-- Thin Animated Border -->
  <rect x="1" y="1" width="578" height="148" rx="12" fill="none" stroke="#2496ED" stroke-width="1.5" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#2496ED;#3ECF8E;#2496ED" dur="5.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Category Title -->
  <text x="24" y="34" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#00FF99">⚡ Backend, DevOps &amp; Databases</text>

  <!-- Row 1 Badges -->
  <!-- Docker -->
  <g transform="translate(24, 52)">
    <rect width="94" height="30" rx="6" fill="#2496ED"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Docker</text>
  </g>

  <!-- Node.js -->
  <g transform="translate(128, 52)">
    <rect width="95" height="30" rx="6" fill="#339933"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Node.js</text>
  </g>

  <!-- Express.js -->
  <g transform="translate(233, 52)">
    <rect width="105" height="30" rx="6" fill="#000000" stroke="#444444" stroke-width="0.8"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Express.js</text>
  </g>

  <!-- MongoDB -->
  <g transform="translate(348, 52)">
    <rect width="102" height="30" rx="6" fill="#47A248"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">MongoDB</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(460, 52)">
    <rect width="106" height="30" rx="6" fill="#4169E1"/>
    <text x="12" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff">PostgreSQL</text>
  </g>

  <!-- Row 2 Badges -->
  <!-- Supabase -->
  <g transform="translate(24, 94)">
    <rect width="108" height="30" rx="6" fill="#1C1C1C" stroke="#3ECF8E" stroke-width="1"/>
    <path fill="#3ECF8E" d="M12 4l-8 10h7l-1 8 8-10h-7l1-8z" transform="scale(0.8) translate(3, 1)"/>
    <text x="30" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#3ECF8E">Supabase</text>
  </g>

  <!-- Firebase -->
  <g transform="translate(142, 94)">
    <rect width="98" height="30" rx="6" fill="#FFCA28"/>
    <text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#000000">Firebase</text>
  </g>

</svg>
