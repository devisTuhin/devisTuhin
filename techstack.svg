<svg width="100%" viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tag { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #00FF99; opacity: 0.9; }
    .title { font-family: 'Courier New', Courier, monospace; font-size: 26px; font-weight: 800; fill: #ffffff; }
    .card-title { font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
    
    @keyframes borderGlow {
      0%, 100% { stroke-opacity: 0.35; stroke: #00FF99; }
      50% { stroke-opacity: 0.85; stroke: #00D4FF; }
    }
    
    @keyframes cardHover {
      0%, 100% { stroke-opacity: 0.25; }
      50% { stroke-opacity: 0.6; }
    }

    .main-border {
      animation: borderGlow 4s ease-in-out infinite;
    }

    .sub-card {
      animation: cardHover 5s ease-in-out infinite;
    }
  </style>

  <!-- Section Tag Header -->
  <text x="20" y="28" class="tag">&lt;section id="techstack"&gt;</text>
  <text x="20" y="62" class="title">Tech Stack &amp; Ecosystem</text>

  <!-- Main Outer Container Box -->
  <rect x="20" y="80" width="760" height="465" rx="16" ry="16" fill="#121217"/>
  <rect x="20.5" y="80.5" width="759" height="464" rx="15.5" ry="15.5" fill="none" stroke="#00FF99" stroke-width="1.5" class="main-border"/>

  <!-- ================= SUB CARD 1: Programming Languages & Mobile ================= -->
  <g transform="translate(35, 95)">
    <rect width="355" height="215" rx="12" fill="#181820" stroke="#00FF99" stroke-width="1" stroke-opacity="0.3" class="sub-card"/>
    <text x="16" y="28" class="card-title"><tspan fill="#00FF99">&gt; </tspan>Programming Languages &amp; Mobile</text>

    <!-- Dart -->
    <g transform="translate(16, 44)">
      <rect width="76" height="28" rx="5" fill="#0175C2"/>
      <path d="M10 9L15 14L11.5 19L6.5 14z" fill="#ffffff" opacity="0.9"/>
      <path d="M15 14L18.5 17.5L14 19L11.5 19z" fill="#ffffff" opacity="0.6"/>
      <text x="24" y="19" class="badge-text" fill="#ffffff">Dart</text>
    </g>

    <!-- Flutter -->
    <g transform="translate(98, 44)">
      <rect width="88" height="28" rx="5" fill="#02569B"/>
      <path d="M16 8L10 14L13 17L19 11z" fill="#ffffff"/>
      <path d="M13 17L16 20L19 17L16 14z" fill="#39CEFD"/>
      <text x="24" y="19" class="badge-text" fill="#ffffff">Flutter</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(192, 44)">
      <rect width="108" height="28" rx="5" fill="#F7DF1E"/>
      <rect x="8" y="7" width="14" height="14" rx="2" fill="#000000"/>
      <text x="11" y="18" font-family="sans-serif" font-size="10" font-weight="900" fill="#F7DF1E">JS</text>
      <text x="28" y="19" class="badge-text" fill="#000000">JavaScript</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(16, 82)">
      <rect width="108" height="28" rx="5" fill="#3178C6"/>
      <rect x="8" y="7" width="14" height="14" rx="2" fill="#ffffff"/>
      <text x="11" y="18" font-family="sans-serif" font-size="10" font-weight="900" fill="#3178C6">TS</text>
      <text x="28" y="19" class="badge-text" fill="#ffffff">TypeScript</text>
    </g>

    <!-- Python -->
    <g transform="translate(130, 82)">
      <rect width="88" height="28" rx="5" fill="#3776AB"/>
      <path d="M12 7.5c-2 0-3 1-3 2.5v2h3v.5H9v2c0 1.5 1 2.5 3 2.5h2v-1.5c0-1-.8-1.5-2-1.5h-1v-2h4c1.5 0 2.5-1 2.5-2.5V8c0-1.5-1.5-1.5-4-1.5h-2z" fill="#FFD43B"/>
      <path d="M16 20.5c2 0 3-1 3-2.5v-2h-3v-.5h3v-2c0-1.5-1-2.5-3-2.5h-2v1.5c0 1 .8 1.5 2 1.5h1v2h-4c-1.5 0-2.5 1-2.5 2.5v1.5c0 1.5 1.5 1.5 4 1.5h2z" fill="#306998"/>
      <text x="25" y="19" class="badge-text" fill="#ffffff">Python</text>
    </g>

    <!-- C++ -->
    <g transform="translate(224, 82)">
      <rect width="66" height="28" rx="5" fill="#00599C"/>
      <text x="12" y="19" class="badge-text" fill="#ffffff">C++</text>
    </g>

    <!-- Swift -->
    <g transform="translate(16, 120)">
      <rect width="78" height="28" rx="5" fill="#FA7343"/>
      <path d="M17 7.5c-3 3-5 7-4 11-2-1-4-4-4-7 0 3 2 6 5 8-4 0-7-3-7-7 0 4 3 8 8 8 4 0 7-3 7-7-2 1-4 0-5-6z" fill="#ffffff"/>
      <text x="24" y="19" class="badge-text" fill="#ffffff">Swift</text>
    </g>

    <!-- Java -->
    <g transform="translate(100, 120)">
      <rect width="72" height="28" rx="5" fill="#007396"/>
      <text x="14" y="19" class="badge-text" fill="#ffffff">Java</text>
    </g>
  </g>

  <!-- ================= SUB CARD 2: Frontend Frameworks ================= -->
  <g transform="translate(410, 95)">
    <rect width="355" height="215" rx="12" fill="#181820" stroke="#00FF99" stroke-width="1" stroke-opacity="0.3" class="sub-card"/>
    <text x="16" y="28" class="card-title"><tspan fill="#00FF99">&gt; </tspan>Frontend Frameworks</text>

    <!-- Flutter -->
    <g transform="translate(16, 44)">
      <rect width="88" height="28" rx="5" fill="#02569B"/>
      <path d="M16 8L10 14L13 17L19 11z" fill="#ffffff"/>
      <path d="M13 17L16 20L19 17L16 14z" fill="#39CEFD"/>
      <text x="24" y="19" class="badge-text" fill="#ffffff">Flutter</text>
    </g>

    <!-- React Native -->
    <g transform="translate(110, 44)">
      <rect width="122" height="28" rx="5" fill="#162c3d" stroke="#61DAFB" stroke-width="1"/>
      <ellipse cx="17" cy="14" rx="6" ry="2.2" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(30 17 14)"/>
      <ellipse cx="17" cy="14" rx="6" ry="2.2" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(90 17 14)"/>
      <ellipse cx="17" cy="14" rx="6" ry="2.2" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(150 17 14)"/>
      <circle cx="17" cy="14" r="1.2" fill="#61DAFB"/>
      <text x="28" y="19" class="badge-text" fill="#61DAFB">React Native</text>
    </g>

    <!-- React -->
    <g transform="translate(238, 44)">
      <rect width="80" height="28" rx="5" fill="#162c3d" stroke="#61DAFB" stroke-width="1"/>
      <ellipse cx="16" cy="14" rx="5.5" ry="2.2" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(30 16 14)"/>
      <ellipse cx="16" cy="14" rx="5.5" ry="2.2" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(90 16 14)"/>
      <ellipse cx="16" cy="14" rx="5.5" ry="2.2" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(150 16 14)"/>
      <circle cx="16" cy="14" r="1.2" fill="#61DAFB"/>
      <text x="26" y="19" class="badge-text" fill="#61DAFB">React</text>
    </g>

    <!-- Next.js -->
    <g transform="translate(16, 82)">
      <rect width="88" height="28" rx="5" fill="#000000" stroke="#444444" stroke-width="1"/>
      <circle cx="15" cy="14" r="6.5" fill="#ffffff"/>
      <path d="M12 10v7.5l6.5-8.5h-1.8l-4.7 5.7v-4.7z" fill="#000000"/>
      <text x="26" y="19" class="badge-text" fill="#ffffff">Next.js</text>
    </g>

    <!-- Vue.js -->
    <g transform="translate(110, 82)">
      <rect width="80" height="28" rx="5" fill="#4FC08D"/>
      <path d="M8 9.5h3.5l4.5 8 4.5-8H24l-9 16z" fill="#35495E" transform="scale(0.5) translate(0,2)"/>
      <path d="M8 9.5h3.5l4.5 8 4.5-8H24l-9 16z" fill="#4FC08D" transform="scale(0.5) translate(0,2)"/>
      <text x="24" y="19" class="badge-text" fill="#ffffff">Vue.js</text>
    </g>

    <!-- Tailwind CSS -->
    <g transform="translate(196, 82)">
      <rect width="122" height="28" rx="5" fill="#06B6D4"/>
      <path d="M11 14c1.2-2.4 2.8-3.6 4.9-3.6 3.1 0 3.9 2.4 5.5 2.4 1.1 0 2-.6 2.9-1.9-1.2 2.4-2.8 3.6-4.9 3.6-3.1 0-3.9-2.4-5.5-2.4-1.1 0-2 .6-2.9 1.9z" fill="#ffffff"/>
      <text x="25" y="19" class="badge-text" fill="#ffffff">Tailwind CSS</text>
    </g>

    <!-- HTML5 -->
    <g transform="translate(16, 120)">
      <rect width="80" height="28" rx="5" fill="#E34F26"/>
      <path d="M9 7l1 10.5 4.5 1.5 4.5-1.5 1-10.5H9z" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <text x="24" y="19" class="badge-text" fill="#ffffff">HTML5</text>
    </g>

    <!-- CSS3 -->
    <g transform="translate(102, 120)">
      <rect width="74" height="28" rx="5" fill="#1572B6"/>
      <text x="16" y="19" class="badge-text" fill="#ffffff">CSS3</text>
    </g>
  </g>

  <!-- ================= SUB CARD 3: Backend, DevOps & Databases ================= -->
  <g transform="translate(35, 325)">
    <rect width="355" height="215" rx="12" fill="#181820" stroke="#00FF99" stroke-width="1" stroke-opacity="0.3" class="sub-card"/>
    <text x="16" y="28" class="card-title"><tspan fill="#00FF99">&gt; </tspan>Backend, DevOps &amp; Databases</text>

    <!-- Docker -->
    <g transform="translate(16, 44)">
      <rect width="88" height="28" rx="5" fill="#2496ED"/>
      <rect x="8" y="13" width="3" height="3" fill="#ffffff"/>
      <rect x="12" y="13" width="3" height="3" fill="#ffffff"/>
      <rect x="16" y="13" width="3" height="3" fill="#ffffff"/>
      <rect x="12" y="9" width="3" height="3" fill="#ffffff"/>
      <rect x="16" y="9" width="3" height="3" fill="#ffffff"/>
      <text x="24" y="19" class="badge-text" fill="#ffffff">Docker</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(110, 44)">
      <rect width="90" height="28" rx="5" fill="#339933"/>
      <path d="M14 8l4.5 2.6v5.2L14 18.4l-4.5-2.6V10.6z" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <text x="23" y="19" class="badge-text" fill="#ffffff">Node.js</text>
    </g>

    <!-- Express.js -->
    <g transform="translate(206, 44)">
      <rect width="102" height="28" rx="5" fill="#1e1e24" stroke="#444444" stroke-width="1"/>
      <text x="14" y="19" class="badge-text" fill="#ffffff">Express.js</text>
    </g>

    <!-- MongoDB -->
    <g transform="translate(16, 82)">
      <rect width="98" height="28" rx="5" fill="#47A248"/>
      <path d="M15 7.5c-2 3.5-3.5 6.5-3.5 9.5 0 1.8 1.3 3.5 3.5 3.5s3.5-1.7 3.5-3.5c0-3-1.5-6-3.5-9.5z" fill="#ffffff" opacity="0.85"/>
      <text x="22" y="19" class="badge-text" fill="#ffffff">MongoDB</text>
    </g>

    <!-- PostgreSQL -->
    <g transform="translate(120, 82)">
      <rect width="112" height="28" rx="5" fill="#4169E1"/>
      <text x="14" y="19" class="badge-text" fill="#ffffff">PostgreSQL</text>
    </g>

    <!-- Supabase -->
    <g transform="translate(238, 82)">
      <rect width="98" height="28" rx="5" fill="#3ECF8E"/>
      <path d="M15 6l-5.5 9.5h4.4l-1.5 8.5 8.3-10.8h-4.4z" fill="#000000"/>
      <text x="22" y="19" class="badge-text" fill="#000000">Supabase</text>
    </g>

    <!-- Firebase -->
    <g transform="translate(16, 120)">
      <rect width="92" height="28" rx="5" fill="#FFCA28"/>
      <path d="M9.5 20l3-12.5 3 5z" fill="#FFA000"/>
      <path d="M9.5 20l7.5-5.5-2-9.5z" fill="#F57C00"/>
      <text x="21" y="19" class="badge-text" fill="#000000">Firebase</text>
    </g>
  </g>

  <!-- ================= SUB CARD 4: Automation, IDEs & Tools ================= -->
  <g transform="translate(410, 325)">
    <rect width="355" height="215" rx="12" fill="#181820" stroke="#00FF99" stroke-width="1" stroke-opacity="0.3" class="sub-card"/>
    <text x="16" y="28" class="card-title"><tspan fill="#00FF99">&gt; </tspan>Automation, IDEs &amp; Tools</text>

    <!-- Selenium -->
    <g transform="translate(16, 44)">
      <rect width="92" height="28" rx="5" fill="#43B02A"/>
      <text x="14" y="19" class="badge-text" fill="#ffffff">Selenium</text>
    </g>

    <!-- Puppeteer -->
    <g transform="translate(114, 44)">
      <rect width="102" height="28" rx="5" fill="#40B5A4"/>
      <text x="14" y="19" class="badge-text" fill="#ffffff">Puppeteer</text>
    </g>

    <!-- n8n -->
    <g transform="translate(222, 44)">
      <rect width="66" height="28" rx="5" fill="#EA4B71"/>
      <text x="14" y="19" class="badge-text" fill="#ffffff">n8n</text>
    </g>

    <!-- Git -->
    <g transform="translate(294, 44)">
      <rect width="45" height="28" rx="5" fill="#F05032"/>
      <text x="12" y="19" class="badge-text" fill="#ffffff">Git</text>
    </g>

    <!-- VS Code -->
    <g transform="translate(16, 82)">
      <rect width="92" height="28" rx="5" fill="#007ACC"/>
      <path d="M9.5 14l3.5-3.5-3.5-3.5v7z" fill="#ffffff"/>
      <text x="21" y="19" class="badge-text" fill="#ffffff">VS Code</text>
    </g>

    <!-- Postman -->
    <g transform="translate(114, 82)">
      <rect width="92" height="28" rx="5" fill="#FF6C37"/>
      <circle cx="14" cy="14" r="4.5" fill="#ffffff"/>
      <text x="23" y="19" class="badge-text" fill="#ffffff">Postman</text>
    </g>
  </g>

  <!-- Section Footer Tag -->
  <text x="20" y="565" class="tag">&lt;/section&gt;</text>
</svg>
