    .card-title { font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
